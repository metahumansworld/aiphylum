<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  /* The platform's palette, the chat's layout. The material is clay — see
     web/static/style.css's header for the spec: one warm cream ground, the
     header a slab of the Perano tint (--surface-voice, 40% Perano in the
     raised cream — this is the agent's surface, so it takes the palette's
     voice-of-the-agent), the agent's lines molded up off the ground in the
     Perano wash, yours pressed into it, and a squish on the send button. */
  :root {
    color-scheme: light;
    --surface-page: #f3ede3; --surface-raised: #faf5eb; --surface-sunken: #e9e2d3;
    --ink: #35302a; --ink-secondary: #55493c; --ink-muted: #635a4c;
    --accent: #5f4c05; --accent-bright: #ffeda2; --accent-wash: #fff7d9; --danger: #9c2a43;
    --attention-wash: #e3e9ff; --surface-voice: #d7dbf3;
    --clay-raise: inset 3px 3px 6px rgba(255, 255, 255, .65),
                  inset -3px -3px 6px rgba(53, 48, 42, .08),
                  4px 5px 12px rgba(53, 48, 42, .13);
    --clay-sink: inset 4px 4px 9px rgba(53, 48, 42, .10),
                 inset -4px -4px 9px rgba(255, 255, 255, .55);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.45 var(--font); color: var(--ink); background: var(--surface-page); display: flex; flex-direction: column; }
  header { padding: 0.75rem 1rem; background: var(--surface-voice); box-shadow: var(--clay-raise); position: relative; z-index: 1; }
  header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
  ol { list-style: none; margin: 0; padding: 1rem; flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 0.6rem; }
  li { padding: 0.5rem 0.8rem; border-radius: 14px; background: var(--attention-wash); box-shadow: var(--clay-raise); max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; }
  li.you { align-self: flex-end; background: var(--surface-sunken); box-shadow: var(--clay-sink); }
  li.refused { box-shadow: var(--clay-raise), inset 0 0 0 2px var(--danger); color: var(--ink-secondary); }
  form { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; }
  input { flex: 1; font: inherit; color: inherit; padding: 0.5rem 0.7rem; border: 0; border-radius: 12px; background: var(--surface-sunken); box-shadow: var(--clay-sink); }
  button {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--accent-bright);
    border: 0; border-radius: 12px; padding: 0.45rem 0.9rem; cursor: pointer;
    box-shadow: inset 3px 3px 6px rgba(255, 250, 224, .8),
                inset -3px -3px 6px rgba(95, 76, 5, .22),
                4px 5px 12px rgba(53, 48, 42, .18);
    transition: transform 320ms var(--spring), box-shadow 120ms ease;
  }
  button:active {
    transform: scale(.95); transition-duration: 120ms;
    box-shadow: inset 3px 3px 7px rgba(95, 76, 5, .3),
                inset -3px -3px 7px rgba(255, 250, 224, .45),
                2px 3px 6px rgba(53, 48, 42, .12);
  }
  button:disabled, input:disabled { opacity: 0.55; cursor: default; transform: none; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  p.status { margin: 0; padding: 0 1rem 0.5rem; color: var(--ink-muted); font-size: 0.8125rem; min-height: 1.2em; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } button:active { transform: none; } }
  @media (forced-colors: active) { li, input, button, header { border: 1px solid CanvasText; } }
</style>
</head>
<body>
<header><h1 id="name">…</h1></header>
<ol id="log" aria-live="polite"></ol>
<p class="status" id="status"></p>
<form id="form">
  <input id="input" type="text" placeholder="Say something" autocomplete="off" maxlength="4096" disabled>
  <button id="send" type="submit" disabled>Send</button>
</form>
<script>
(function () {
  // /a/{id}/embed → the agent is the second segment. Everything rendered
  // from the agent goes in as text: its name and its replies are the
  // owner's words, not the platform's.
  var id = location.pathname.split("/")[2];
  var base = "/a/" + encodeURIComponent(id);
  var conversation = "";
  var log = document.getElementById("log"), input = document.getElementById("input"),
      send = document.getElementById("send"), status = document.getElementById("status");

  function line(text, cls) {
    var li = document.createElement("li");
    if (cls) li.className = cls;
    li.textContent = text;
    log.append(li);
    log.scrollTop = log.scrollHeight;
  }
  function enable(on) { input.disabled = send.disabled = !on; if (on) input.focus(); }

  fetch(base).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }).then(function (card) {
    document.getElementById("name").textContent = card.name;
    document.title = card.name;
    if (card.greeting) line(card.greeting);
    enable(true);
  }).catch(function () {
    document.getElementById("name").textContent = "Not here";
    line("This agent is not reachable any more.", "refused");
  });

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    line(text, "you");
    input.value = "";
    status.textContent = "";
    enable(false);
    fetch(base + "/messages", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation: conversation, text: text }),
    }).then(function (r) {
      return r.text().then(function (body) {
        var data = {}; try { data = JSON.parse(body); } catch (_) {}
        if (r.ok) { conversation = data.conversation; line(data.reply); return; }
        if (r.status === 429) { status.textContent = "Too fast. Try again in " + (r.headers.get("Retry-After") || "a few") + "s."; }
        else if (r.status === 402) { line("This agent is out of credits for now.", "refused"); }
        else if (r.status === 404) { conversation = ""; line("That conversation ended. Say it again to start a new one.", "refused"); }
        else { line(data.error || "The agent could not answer.", "refused"); }
      });
    }).catch(function () { line("Could not reach the agent.", "refused"); }).then(function () { enable(true); });
  });
})();
</script>
</body>
</html>
